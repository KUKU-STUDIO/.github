name: Error
description: Algo no funciona como debería
labels: ["type/bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo observado y lo que esperabas. Sin secretos ni datos de personas.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Local o producción, sistema operativo, versión de Node.
